# =====================================================
# APPLICATION
# =====================================================

spring.application.name=medipharm

app.frontend.url=${FRONTEND_URL://localhost:3000}
# =====================================================
# DATABASE - POSTGRESQL
# =====================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false


# =====================================================
# SERVER
# =====================================================

server.port=${PORT:8080}


# =====================================================
# FILE UPLOAD
# =====================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
tesseract.datapath=${TESSERACT_DATA_PATH}

# =====================================================
# RAZORPAY
# =====================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}


# =====================================================
# SIGHTENGINE AI IMAGE DETECTION
# =====================================================

sightengine.api.user=${SIGHTENGINE_API_USER}
sightengine.api.secret=${SIGHTENGINE_API_SECRET}

prescription.ai-detection.enabled=${PRESCRIPTION_AI_DETECTION_ENABLED}
prescription.ai-reject-threshold=${PRESCRIPTION_AI_REJECT_THRESHOLD}


# =====================================================
# GEMINI
# =====================================================

gemini.api.key=${GOOGLE_API_KEY}
gemini.api.url=${GEMINI_API_URL}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.6-flash}
gemini.api.fallback-models=${GEMINI_API_FALLBACK_MODELS:${GEMINI_API_FALLBACK_MODEL:gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash-lite}}


# =====================================================
# GOOGLE OAUTH2
# =====================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email
